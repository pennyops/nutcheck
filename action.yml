name: nutlint
description: Re-derive every Cashu NUTs test vector and check spec examples (pure-stdlib Python)
branding:
  icon: check-circle
  color: orange
inputs:
  path:
    description: Path to a checkout of cashubtc/nuts (or a fork)
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: PYTHONPATH="${{ github.action_path }}" python3 -m nutlint "${{ inputs.path }}"
