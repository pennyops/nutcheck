name: check-nuts-vectors
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  nutcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --depth 1 https://github.com/cashubtc/nuts nuts
      - run: python3 -m nutcheck ./nuts
