[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nutlint"
version = "0.1.1"
description = "Independent checker for the Cashu NUTs test vectors and spec examples (pure stdlib)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
nutlint = "nutlint.__main__:cli"

[tool.setuptools]
packages = ["nutlint"]
